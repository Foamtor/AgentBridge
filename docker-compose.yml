services:
  postgres:
    image: ${IMAGE_REGISTRY:-docker.m.daocloud.io}/pgvector/pgvector:pg16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: agentbridge
    volumes:
      - agentbridge-postgres:/var/lib/postgresql/data
      - ./apps/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentbridge"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.m.daocloud.io}
    environment:
      AUTH_MODE: local
      AUTH_REQUIRED: "false"
      AGENTBRIDGE_FAKE_RUNTIME: "0"
      KNOWLEDGE_BACKEND: fake
      LLM_MODE: ${LLM_MODE:-fake}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      MODEL_CONFIG_ENV_FILE: /workspace/.env
      ENABLE_DATA_SOURCE: "true"
      DATA_SOURCE_DSN: ${DATA_SOURCE_DSN:-}
      KB_EXTERNAL_BASE_URL: ${KB_EXTERNAL_BASE_URL:-}
      KB_EXTERNAL_API_KEY: ${KB_EXTERNAL_API_KEY:-}
      APPROVAL_STORE_BACKEND: postgres
      OBSERVABILITY_STORE_BACKEND: postgres
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: agentbridge
      PG_USER: postgres
      PG_PASSWORD: change-me
      USE_MEMORY_CHECKPOINTER: "false"
    volumes:
      - ./.env:/workspace/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE: /api
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.m.daocloud.io}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  redis:
    profiles: ["redis"]
    image: ${IMAGE_REGISTRY:-docker.m.daocloud.io}/library/redis:7-alpine

  authentik-server:
    profiles: ["auth"]
    image: ${AUTHENTIK_IMAGE:-docker.m.daocloud.io/ghcr.io/goauthentik/server:2024.8.3}
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-me-please-use-long-random}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: postgres
      AUTHENTIK_POSTGRESQL__PASSWORD: change-me
      AUTHENTIK_POSTGRESQL__NAME: agentbridge
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  agentbridge-postgres:
