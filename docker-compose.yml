services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: agent_base
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_base"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Optional IdP — not required for local smoke
  authentik-server:
    profiles: ["auth"]
    image: ghcr.io/goauthentik/server:2024.8.3
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-change-me-please-use-long-random}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: postgres
      AUTHENTIK_POSTGRESQL__PASSWORD: change-me
      AUTHENTIK_POSTGRESQL__NAME: agent_base
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
