[project]
name = "agentbridge-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "agentbridge-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-jose[cryptography]>=3.3",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]
datasource = [
  "asyncpg>=0.29,<1",
]
redis = [
  "redis>=5.0,<6",
]
rag = [
  "agentbridge-core[rag]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auth", "config", "routes", "domains", "adapters", "testing", "middleware", "observability"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"lifespan.py" = "lifespan.py"
"deps.py" = "deps.py"

[tool.uv.sources]
agentbridge-core = { path = "../../packages/core", editable = true }
