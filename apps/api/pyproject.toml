[project]
name = "agent-base-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "agent-base-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-jose[cryptography]>=3.3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auth", "config", "routes", "domains"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"lifespan.py" = "lifespan.py"
"deps.py" = "deps.py"

[tool.uv.sources]
agent-base-core = { path = "../../packages/core", editable = true }
