[project]
name = "agentbridge-core"
version = "1.0.0"
description = "AgentBridge orchestration core"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
  "import-linter>=2.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]
postgres = [
  "psycopg[binary,pool]>=3.2",
  "langgraph-checkpoint-postgres>=2.0",
]
tiktoken = [
  "tiktoken>=0.7",
]
rag = [
  "langchain-postgres>=0.0.14",
  "langchain-openai>=0.2",
  "asyncpg>=0.29,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbridge_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["tests"]
